<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escape from Zombie</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #ffff00;
      font-size: 28px;
      font-weight: bold;
      z-index: 100;
      text-shadow: 0 0 12px #ffff00;
    }
    #title {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #e50914;
      font-size: 26px;
      font-weight: bold;
      z-index: 100;
    }

    /* Controlli grandi */
    .controls {
      position: absolute;
      bottom: 25px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 200;
    }
    .dpad {
      display: grid;
      grid-template-columns: 95px 95px 95px;
      grid-template-rows: 95px 95px 95px;
      gap: 12px;
    }
    .dpad button {
      background: rgba(255,255,255,0.2);
      border: 4px solid #ffff00;
      color: white;
      font-size: 40px;
      border-radius: 18px;
    }
    .action-btn {
      background: rgba(255,60,60,0.75);
      border: 6px solid #ffff00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50%;
      width: 105px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="title">ESCAPE FROM ZOMBIE</div>
  <div id="ui">Tempo: <span id="time">0</span>s</div>
  
  <canvas id="game"></canvas>

  <!-- Controlli -->
  <div class="controls">
    <div class="dpad">
      <div></div>
      <button id="up">↑</button>
      <div></div>
      <button id="left">←</button>
      <div></div>
      <button id="right">→</button>
      <div></div>
      <button id="down">↓</button>
      <div></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:15px;">
      <button id="shoot" class="action-btn">SPARA</button>
      <button id="bazooka" class="action-btn">BAZOOKA</button>
      <button id="tornado" class="action-btn">TORNADO</button>
      <button id="fire" class="action-btn">FUOCO</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let timeSurvived = 0;
let gameRunning = true;
let lastTime = Date.now();

const player = {
  x: canvas.width / 2,
  y: canvas.height - 100,
  width: 32,
  height: 42,
  speed: 8
};

let bullets = [];
let enemies = [];
let keys = {};

// ===================== CONTROLLI =====================
document.getElementById('up').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowUp'] = true; });
document.getElementById('up').addEventListener('touchend', () => keys['ArrowUp'] = false);

document.getElementById('down').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowDown'] = true; });
document.getElementById('down').addEventListener('touchend', () => keys['ArrowDown'] = false);

document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
document.getElementById('left').addEventListener('touchend', () => keys['ArrowLeft'] = false);

document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
document.getElementById('right').addEventListener('touchend', () => keys['ArrowRight'] = false);

// Spara
let shooting = false;
document.getElementById('shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shooting = true; });
document.getElementById('shoot').addEventListener('touchend', () => shooting = false);

setInterval(() => {
  if (shooting && gameRunning) shoot();
}, 70);

// Mosse speciali
let lastSpecial = 0;
const specialCooldown = 30000;

document.getElementById('bazooka').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (Date.now() - lastSpecial > specialCooldown) {
    bazookaAttack();
    lastSpecial = Date.now();
  }
});

document.getElementById('tornado').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (Date.now() - lastSpecial > specialCooldown) {
    tornadoAttack();
    lastSpecial = Date.now();
  }
});

document.getElementById('fire').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (Date.now() - lastSpecial > specialCooldown) {
    fireAttack();
    lastSpecial = Date.now();
  }
});

// ===================== FUNZIONI =====================
function shoot() {
  bullets.push({ x: player.x, y: player.y - 35, width: 6, height: 18, speed: 16 });
}

function bazookaAttack() {
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      bullets.push({
        x: player.x + (Math.random()*120 - 60),
        y: player.y - 60,
        width: 16,
        height: 32,
        speed: 12,
        color: '#ff8800'
      });
    }, i*60);
  }
}

function tornadoAttack() {
  for (let i = 0; i < 25; i++) {
    bullets.push({
      x: player.x + (Math.random()*200 - 100),
      y: player.y - 80 - i*12,
      width: 10,
      height: 10,
      speed: 9,
      color: '#00ffff'
    });
  }
}

function fireAttack() {
  for (let i = 0; i < 30; i++) {
    bullets.push({
      x: player.x,
      y: player.y - 40 - i*15,
      width: 7,
      height: 24,
      speed: 14,
      color: '#ff4400'
    });
  }
}

function spawnEnemy() {
  if (Math.random() < 0.045) {
    enemies.push({
      x: Math.random() * (canvas.width - 60) + 30,
      y: -40,
      radius: 16,
      speed: 3.5 + Math.random() * 2.5
    });
  }
}

function gameLoop() {
  if (!gameRunning) return;

  // Movimento
  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;
  if (keys['ArrowUp']) player.y -= player.speed;
  if (keys['ArrowDown']) player.y += player.speed;

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(50, Math.min(canvas.height - 70, player.y));

  // Tempo
  if (Date.now() - lastTime > 1000) {
    timeSurvived++;
    timeElement.textContent = timeSurvived;
    lastTime = Date.now();
  }

  // Proiettili
  bullets = bullets.filter(b => {
    b.y -= b.speed || 15;
    return b.y > -50;
  });

  spawnEnemy();

  // Nemici
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    if (Math.sqrt(dx*dx + dy*dy) < 35 + e.radius) {
      gameOver();
      return;
    }

    if (e.y > canvas.height + 60) enemies.splice(i, 1);
  }

  // Collisione proiettili - nemici
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i];
      const e = enemies[j];
      const dx = b.x - e.x;
      const dy = b.y - e.y;
      if (Math.sqrt(dx*dx + dy*dy) < e.radius + 10) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        break;
      }
    }
  }

  // Disegno
  ctx.fillStyle = '#0a3d0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Prato che scorre
  ctx.fillStyle = '#1a5a1a';
  for (let i = 0; i < 15; i++) {
    ctx.fillRect(0, (Date.now() / 10 % 90) + i*65 - 50, canvas.width, 14);
  }

  // Cursore giallo
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 28);
  ctx.lineTo(player.x - 16, player.y + 22);
  ctx.lineTo(player.x - 8, player.y + 16);
  ctx.lineTo(player.x + 8, player.y + 16);
  ctx.lineTo(player.x + 16, player.y + 22);
  ctx.closePath();
  ctx.fill();

  // Proiettili
  ctx.fillStyle = '#00ffff';
  bullets.forEach(b => ctx.fillRect(b.x - 3, b.y, 6, 18));

  // Nemici verdi
  ctx.fillStyle = '#00cc22';
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  alert(`GAME OVER!\n\nSei sopravvissuto ${timeSurvived} secondi!`);
  setTimeout(() => location.reload(), 1500);
}

// Avvio
setupControls();
gameLoop();
</script>
</body>
</html>

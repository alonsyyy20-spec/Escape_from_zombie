<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    :root { --red: #e50914; }
    body {
      margin: 0; padding: 0;
      background: #141414;
      color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Splash */
    #splash {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 2s;
    }
    .logo-big {
      font-size: 92px; font-weight: 900; letter-spacing: -8px;
      color: white; text-shadow: 0 0 60px var(--red);
      animation: glow 2.2s infinite alternate;
    }
    @keyframes glow { from { text-shadow: 0 0 30px var(--red); } to { text-shadow: 0 0 100px var(--red); } }

    /* Profili */
    #profile-screen {
      position: fixed; inset: 0; background: #141414;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; padding: 20px;
    }
    h1 { font-size: 42px; margin-bottom: 50px; }

    .profile-container {
      display: flex; flex-wrap: wrap; gap: 28px; justify-content: center;
    }
    .profile {
      text-align: center; cursor: pointer; position: relative;
    }
    .profile:hover { transform: scale(1.1); }
    .profile-img {
      width: 135px; height: 135px; border-radius: 12px; object-fit: cover;
      border: 4px solid transparent;
    }
    .profile:hover .profile-img { border-color: var(--red); }
    .profile-name { margin-top: 12px; font-size: 18px; }

    .edit-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8);
      color: white; border: none; width: 32px; height: 32px; border-radius: 50%;
      font-size: 18px; cursor: pointer; display: none;
    }
    .profile:hover .edit-btn { display: block; }

    .add-profile {
      width: 135px; height: 135px; border: 4px dashed #666; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 60px;
      color: #666; cursor: pointer;
    }

    /* Home */
    .home-screen { display: none; }
    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
      padding: 15px 20px; display: flex; align-items: center; position: fixed;
      width: 100%; z-index: 100;
    }
    .logo { font-size: 34px; font-weight: bold; color: var(--red); }

    .right-header { margin-left: auto; display: flex; align-items: center; gap: 15px; }

    .movies { display: flex; gap: 12px; overflow-x: auto; padding: 100px 20px 30px; }
    .movie {
      width: 195px; height: 110px; background-size: cover; background-position: center;
      border-radius: 8px; cursor: pointer; transition: transform 0.4s; flex-shrink: 0;
    }
    .movie:hover { transform: scale(1.13); }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="logo-big">ZOTFLIX</div>
  </div>

  <!-- Profili -->
  <div id="profile-screen">
    <h1>Chi sta guardando?</h1>
    <div class="profile-container" id="profiles"></div>
  </div>

  <!-- Home -->
  <div class="home-screen" id="home-screen">
    <header>
      <div class="logo">ZOTFLIX</div>
      <div class="right-header">
        <span id="current-profile-name" onclick="logoutProfile()" style="cursor:pointer; font-size:18px;"></span>
        <button onclick="showAdmin()" style="background:var(--red); border:none; color:white; padding:8px 20px; border-radius:4px; cursor:pointer;">Admin</button>
      </div>
    </header>

    <div style="padding-top:110px; padding-left:20px;">
      <h2>I miei film</h2>
      <div class="movies" id="myMovies"></div>
    </div>
  </div>

  <!-- Modal Video -->
  <div id="videoModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center; padding:10px;">
    <div style="width:95%; max-width:1100px;">
      <video id="player" controls autoplay controlsList="nodownload" style="width:100%; border-radius:8px;"></video>
      <button onclick="closeModal()" style="margin-top:15px; background:#333; color:white; border:none; padding:12px 25px; border-radius:4px;">Chiudi</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:3000; align-items:center; justify-content:center; padding:15px;">
    <div style="background:#1f1f1f; padding:25px; border-radius:12px; width:100%; max-width:620px;">
      <h2>Carica nuovo film</h2>
      <input type="text" id="title" placeholder="Titolo del film" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white; border-radius:6px;">
      <input type="text" id="desc" placeholder="Descrizione" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white; border-radius:6px;">

      <button onclick="document.getElementById('coverFile').click()" style="width:100%; padding:14px; margin:10px 0; background:#333; color:white; border:none; border-radius:6px;">
        🖼️ Seleziona Copertina dalla Galleria
      </button>
      <input type="file" id="coverFile" accept="image/*" style="display:none;" onchange="handleCoverUpload(event)">

      <button onclick="document.getElementById('videoFile').click()" style="width:100%; padding:14px; margin:10px 0; background:var(--red); color:white; border:none; border-radius:6px;">
        📹 Seleziona Video dalla Galleria
      </button>
      <input type="file" id="videoFile" accept="video/mp4,video/webm" style="display:none;" onchange="handleVideoUpload(event)">

      <div style="margin-top:25px; display:flex; gap:15px;">
        <button onclick="addMovie()" style="flex:1; background:var(--red); color:white; border:none; padding:14px; border-radius:6px;">Pubblica Film</button>
        <button onclick="closeAdmin()" style="flex:1; background:#555; color:white; border:none; padding:14px; border-radius:6px;">Annulla</button>
      </div>
    </div>
  </div>

<script>
// ==================== 50 IMMAGINI PROFILI ====================
const profileImages = Array.from({length: 50}, (_, i) => `https://picsum.photos/id/${60 + i}/300/300`);

let profiles = JSON.parse(localStorage.getItem('zotflixProfiles')) || [
  { id: 1, name: "Matteo", image: profileImages[0] },
  { id: 2, name: "Sara", image: profileImages[1] }
];

let currentProfile = null;
let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];
let currentVideoFile = null;
let currentCoverFile = null;
const ADMIN_PASSWORD = "admin";

// ===================== SPLASH =====================
setTimeout(() => {
  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    showProfileScreen();
  }, 1800);
}, 2200);

// ===================== PROFILI =====================
function showProfileScreen() {
  const container = document.getElementById('profiles');
  container.innerHTML = '';

  profiles.forEach(p => {
    const div = document.createElement('div');
    div.className = 'profile';
    div.innerHTML = `
      <img src="${p.image}" class="profile-img">
      <button class="edit-btn" onclick="editProfile(${p.id}); event.stopImmediatePropagation();">✏️</button>
      <div class="profile-name">${p.name}</div>
    `;
    div.onclick = () => selectProfile(p);
    container.appendChild(div);
  });

  const add = document.createElement('div');
  add.className = 'profile';
  add.innerHTML = `<div class="add-profile">+</div><div class="profile-name">Aggiungi</div>`;
  add.onclick = addNewProfile;
  container.appendChild(add);

  document.getElementById('profile-screen').style.display = 'flex';
}

function selectProfile(profile) {
  currentProfile = profile;
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  document.getElementById('current-profile-name').textContent = profile.name;
  renderMovies();
}

function editProfile(id) {
  const profile = profiles.find(p => p.id === id);
  if (!profile) return;

  const newName = prompt("Nuovo nome del profilo:", profile.name);
  if (newName) profile.name = newName;

  const newImg = prompt("URL nuova immagine (lascia vuoto per sceglierne una casuale):", profile.image);
  if (newImg) profile.image = newImg;

  localStorage.setItem('zotflixProfiles', JSON.stringify(profiles));
  showProfileScreen();
}

function addNewProfile() {
  if (profiles.length >= 5) return alert("Massimo 5 profili!");
  const name = prompt("Nome del nuovo profilo:");
  if (!name) return;

  const randomImg = profileImages[Math.floor(Math.random() * profileImages.length)];
  profiles.push({ id: Date.now(), name, image: randomImg });
  localStorage.setItem('zotflixProfiles', JSON.stringify(profiles));
  showProfileScreen();
}

function logoutProfile() {
  if (confirm("Vuoi cambiare profilo?")) {
    document.getElementById('home-screen').style.display = 'none';
    currentProfile = null;
    showProfileScreen();
  }
}

// ===================== ADMIN - CARICA FILM =====================
function showAdmin() {
  const pass = prompt("Inserisci password Admin:");
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('adminModal').style.display = 'flex';
  } else {
    alert("Password errata!");
  }
}

function closeAdmin() {
  document.getElementById('adminModal').style.display = 'none';
  currentVideoFile = null;
  currentCoverFile = null;
}

function handleCoverUpload(e) {
  currentCoverFile = e.target.files[0];
}

function handleVideoUpload(e) {
  currentVideoFile = e.target.files[0];
}

function addMovie() {
  const title = document.getElementById('title').value.trim();
  if (!title) return alert("Inserisci il titolo!");
  if (!currentVideoFile) return alert("Devi selezionare un video!");

  const readerVideo = new FileReader();
  readerVideo.onload = function(e) {
    const videoBase64 = e.target.result;

    const readerCover = new FileReader();
    readerCover.onload = function(ev) {
      const coverBase64 = ev.target.result || "https://picsum.photos/220/130?random=" + Date.now();

      movies.push({
        title: title,
        desc: document.getElementById('desc').value.trim(),
        image: coverBase64,
        videoURL: videoBase64
      });

      localStorage.setItem('zotflixMovies', JSON.stringify(movies));
      renderMovies();
      closeAdmin();
      alert("✅ Film salvato correttamente! Rimarrà anche dopo aver chiuso il browser.");
    };
    readerCover.readAsDataURL(currentCoverFile || new Blob());
  };
  readerVideo.readAsDataURL(currentVideoFile);
}

// ===================== RENDER FILM =====================
function renderMovies() {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';

  movies.forEach((movie, i) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image}')`;
    div.onclick = () => playMovie(i);
    container.appendChild(div);
  });
}

function playMovie(index) {
  const movie = movies[index];
  document.getElementById('player').src = movie.videoURL;
  document.getElementById('videoModal').style.display = 'flex';
}

function closeModal() {
  const video = document.getElementById('player');
  video.pause(); video.src = '';
  document.getElementById('videoModal').style.display = 'none';
}

// Inizializza
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: #141414;
      color: white;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .logo-big {
      font-size: 80px; font-weight: bold; color: #e50914;
    }

    #profile-screen, .home-screen { display: none; }

    .profile-container {
      display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; padding: 40px 20px;
    }
    .profile {
      text-align: center; cursor: pointer;
    }
    .profile-img {
      width: 130px; height: 130px; border-radius: 12px; object-fit: cover;
    }
    .profile-name { margin-top: 10px; font-size: 18px; }

    header {
      background: #000; padding: 15px; text-align: center; font-size: 28px; color: #e50914;
      position: fixed; width: 100%; z-index: 100;
    }

    .movies {
      display: flex; gap: 12px; overflow-x: auto; padding: 80px 20px 20px;
    }
    .movie {
      width: 180px; height: 100px; background-size: cover; background-position: center;
      border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="logo-big">ZOTFLIX</div>
  </div>

  <!-- Profili -->
  <div id="profile-screen">
    <h1 style="text-align:center; margin:40px 0 30px;">Chi sta guardando?</h1>
    <div class="profile-container" id="profiles"></div>
  </div>

  <!-- Home -->
  <div class="home-screen" id="home-screen">
    <header>ZOTFLIX</header>
    <div style="padding-top:80px; padding-left:20px;">
      <h2>I miei film</h2>
      <div class="movies" id="myMovies"></div>
    </div>
    <button onclick="showAdmin()" style="position:fixed; bottom:20px; right:20px; background:#e50914; color:white; border:none; padding:15px 25px; border-radius:50px; font-size:16px; box-shadow:0 4px 15px rgba(229,9,20,0.5);">Admin</button>
  </div>

  <!-- Admin Panel -->
  <div id="adminModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; align-items:center; justify-content:center; padding:15px;">
    <div style="background:#1f1f1f; padding:25px; border-radius:12px; width:100%; max-width:580px;">
      <h2>Carica nuovo film</h2>
      <input type="text" id="title" placeholder="Titolo del film" style="width:100%; padding:14px; margin:10px 0; background:#333; border:none; color:white; border-radius:6px;">
      <input type="text" id="desc" placeholder="Descrizione" style="width:100%; padding:14px; margin:10px 0; background:#333; border:none; color:white; border-radius:6px;">

      <button onclick="document.getElementById('coverFile').click()" style="width:100%; padding:14px; margin:10px 0; background:#333; color:white; border:none; border-radius:6px;">
        🖼️ Copertina
      </button>
      <input type="file" id="coverFile" accept="image/*" style="display:none;">

      <button onclick="document.getElementById('videoFile').click()" style="width:100%; padding:14px; margin:10px 0; background:#e50914; color:white; border:none; border-radius:6px;">
        📹 Video
      </button>
      <input type="file" id="videoFile" accept="video/mp4" style="display:none;">

      <div style="margin-top:25px;">
        <button onclick="addMovie()" style="background:#e50914; color:white; border:none; padding:16px; width:100%; border-radius:8px; font-size:17px;">Pubblica Film</button>
      </div>
      <button onclick="closeAdmin()" style="margin-top:10px; background:#555; color:white; border:none; padding:14px; width:100%; border-radius:8px;">Annulla</button>
    </div>
  </div>

<script>
// Password
const ADMIN_PASSWORD = "admin";

let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];

// Splash
setTimeout(() => {
  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('profile-screen').style.display = 'flex';
  }, 1500);
}, 2000);

function showProfileScreen() {
  // Per semplicità, saltiamo la scelta profilo per ora
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  renderMovies();
}

function renderMovies() {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';

  movies.forEach((movie, i) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image || "https://picsum.photos/220/130"}')`;
    div.onclick = () => playMovie(i);
    container.appendChild(div);
  });
}

function playMovie(i) {
  const movie = movies[i];
  if (movie && movie.videoURL) {
    const v = document.createElement('video');
    v.src = movie.videoURL;
    v.controls = true;
    v.style.width = '100%';
    v.style.maxHeight = '80vh';
    document.body.appendChild(v);
    v.play();
  }
}

// Admin
function showAdmin() {
  const pass = prompt("Inserisci password Admin:");
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('adminModal').style.display = 'flex';
  } else {
    alert("Password errata!");
  }
}

function closeAdmin() {
  document.getElementById('adminModal').style.display = 'none';
}

function addMovie() {
  const title = document.getElementById('title').value.trim();
  if (!title) {
    alert("Inserisci il titolo!");
    return;
  }

  const videoInput = document.getElementById('videoFile');
  if (!videoInput.files[0]) {
    alert("Seleziona un video!");
    return;
  }

  const file = videoInput.files[0];

  if (file.size > 80 * 1024 * 1024) {
    alert("Il video è troppo grande! Prova con un video più piccolo (meno di 80MB).");
    return;
  }

  alert("Caricamento in corso...\n\nAttendi qualche secondo, non chiudere la pagina.");

  const reader = new FileReader();
  reader.onload = function(e) {
    movies.push({
      title: title,
      image: "https://picsum.photos/220/130?random=" + Date.now(),
      videoURL: e.target.result
    });

    localStorage.setItem('zotflixMovies', JSON.stringify(movies));
    renderMovies();
    closeAdmin();
    alert("✅ Film pubblicato con successo!");
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>

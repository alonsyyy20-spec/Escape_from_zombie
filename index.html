<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escape from Zombie</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000;
      overflow: hidden;
      touch-action: none;
      height: 100vh;
      width: 100vw;
    }
    canvas {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      max-height: 100vh;
    }

    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffff00;
      font-size: 26px;
      font-weight: bold;
      z-index: 100;
      text-shadow: 0 0 10px #ffff00;
    }
    #title {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: #e50914;
      font-size: 24px;
      font-weight: bold;
      z-index: 100;
    }

    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      z-index: 200;
    }
    .dpad {
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px 80px;
      gap: 10px;
    }
    .dpad button {
      background: rgba(255,255,255,0.2);
      border: 4px solid #ffff00;
      color: white;
      font-size: 36px;
      border-radius: 16px;
    }
    .action-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    .action-btn {
      background: rgba(255,60,60,0.75);
      border: 5px solid #ffff00;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border-radius: 50%;
      width: 95px;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="title">ESCAPE FROM ZOMBIE</div>
  <div id="ui">Tempo: <span id="time">0</span>s</div>
  
  <canvas id="game"></canvas>

  <!-- Controlli -->
  <div class="controls">
    <div class="dpad">
      <div></div>
      <button id="up">↑</button>
      <div></div>
      <button id="left">←</button>
      <div></div>
      <button id="right">→</button>
      <div></div>
      <button id="down">↓</button>
      <div></div>
    </div>

    <div class="action-area">
      <button id="shoot" class="action-btn">SPARA</button>
      <button id="bazooka" class="action-btn">BAZOOKA</button>
      <button id="tornado" class="action-btn">TORNADO</button>
      <button id="fire" class="action-btn">FUOCO</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let timeSurvived = 0;
let gameRunning = true;
let lastTime = Date.now();

const player = {
  x: canvas.width / 2,
  y: canvas.height - 120,
  width: 28,
  height: 38,
  speed: 7.5
};

let bullets = [];
let enemies = [];
let keys = {};

// Controlli Touch
document.getElementById('up').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowUp'] = true; });
document.getElementById('up').addEventListener('touchend', () => keys['ArrowUp'] = false);

document.getElementById('down').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowDown'] = true; });
document.getElementById('down').addEventListener('touchend', () => keys['ArrowDown'] = false);

document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
document.getElementById('left').addEventListener('touchend', () => keys['ArrowLeft'] = false);

document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
document.getElementById('right').addEventListener('touchend', () => keys['ArrowRight'] = false);

// Spara
let shooting = false;
document.getElementById('shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shooting = true; });
document.getElementById('shoot').addEventListener('touchend', () => shooting = false);

setInterval(() => {
  if (shooting && gameRunning) shoot();
}, 75);

// Mosse speciali (cooldown 30 secondi)
let lastSpecial = 0;
const specialCooldown = 30000;

['bazooka', 'tornado', 'fire'].forEach(type => {
  document.getElementById(type).addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (Date.now() - lastSpecial > specialCooldown) {
      if (type === 'bazooka') bazookaAttack();
      if (type === 'tornado') tornadoAttack();
      if (type === 'fire') fireAttack();
      lastSpecial = Date.now();
    }
  });
});

function shoot() {
  bullets.push({ x: player.x, y: player.y - 35, width: 6, height: 18, speed: 16 });
}

function bazookaAttack() {
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      bullets.push({
        x: player.x + (Math.random()*100 - 50),
        y: player.y - 60,
        width: 14,
        height: 30,
        speed: 11,
        color: '#ff8800'
      });
    }, i*60);
  }
}

function tornadoAttack() {
  for (let i = 0; i < 20; i++) {
    bullets.push({
      x: player.x + (Math.random()*180 - 90),
      y: player.y - 80 - i*12,
      width: 9,
      height: 9,
      speed: 9,
      color: '#00ffff'
    });
  }
}

function fireAttack() {
  for (let i = 0; i < 25; i++) {
    bullets.push({
      x: player.x,
      y: player.y - 40 - i*12,
      width: 6,
      height: 22,
      speed: 13,
      color: '#ff4400'
    });
  }
}

function spawnEnemy() {
  if (Math.random() < 0.045) {
    enemies.push({
      x: Math.random() * (canvas.width - 60) + 30,
      y: -40,
      radius: 15,
      speed: 3.5 + Math.random() * 2.5
    });
  }
}

function gameLoop() {
  if (!gameRunning) return;

  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;
  if (keys['ArrowUp']) player.y -= player.speed;
  if (keys['ArrowDown']) player.y += player.speed;

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(50, Math.min(canvas.height - 70, player.y));

  if (Date.now() - lastTime > 1000) {
    timeSurvived++;
    timeElement.textContent = timeSurvived;
    lastTime = Date.now();
  }

  bullets = bullets.filter(b => {
    b.y -= b.speed || 15;
    return b.y > -50;
  });

  spawnEnemy();

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    if (Math.sqrt(dx*dx + dy*dy) < 32 + e.radius) {
      gameOver();
      return;
    }

    if (e.y > canvas.height + 60) enemies.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i];
      const e = enemies[j];
      const dx = b.x - e.x;
      const dy = b.y - e.y;
      if (Math.sqrt(dx*dx + dy*dy) < e.radius + 10) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        break;
      }
    }
  }

  // Disegno
  ctx.fillStyle = '#0a3d0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Prato che scorre
  ctx.fillStyle = '#1a5a1a';
  for (let i = 0; i < 12; i++) {
    ctx.fillRect(0, (Date.now() / 9 % 85) + i*75 - 50, canvas.width, 14);
  }

  // Cursore giallo
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 28);
  ctx.lineTo(player.x - 15, player.y + 20);
  ctx.lineTo(player.x - 7, player.y + 14);
  ctx.lineTo(player.x + 7, player.y + 14);
  ctx.lineTo(player.x + 15, player.y + 20);
  ctx.closePath();
  ctx.fill();

  // Proiettili
  ctx.fillStyle = '#00ffff';
  bullets.forEach(b => ctx.fillRect(b.x - 3, b.y, 6, 18));

  // Nemici verdi
  ctx.fillStyle = '#00cc22';
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  alert(`GAME OVER!\n\nSei sopravvissuto ${timeSurvived} secondi!`);
}

// Avvio
gameLoop();
</script>
</body>
</html>

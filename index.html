<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escape from Zombie</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ffff00;
      font-size: 26px;
      font-weight: bold;
      z-index: 100;
      text-shadow: 0 0 10px #ffff00;
    }
    .controls {
      position: absolute;
      bottom: 15px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 200;
      pointer-events: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: 85px 85px 85px;
      grid-template-rows: 85px 85px 85px;
      gap: 12px;
    }
    .dpad button {
      background: rgba(255,255,255,0.2);
      border: 4px solid #ffff00;
      color: white;
      font-size: 36px;
      border-radius: 16px;
      pointer-events: all;
    }
    .special-btn {
      background: rgba(255, 100, 0, 0.7);
      border: 5px solid #ffff00;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border-radius: 50%;
      width: 85px;
      height: 85px;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
    }
    #shoot {
      background: rgba(255, 0, 0, 0.7);
      border: 5px solid #ffff00;
      color: white;
      font-size: 22px;
      font-weight: bold;
      border-radius: 50%;
      width: 110px;
      height: 110px;
      pointer-events: all;
    }
  </style>
</head>
<body>

  <div id="ui">Tempo: <span id="time">0</span>s</div>
  
  <canvas id="game" width="800" height="600"></canvas>

  <!-- Controlli Touch -->
  <div class="controls">
    <div class="dpad">
      <div></div>
      <button id="up">↑</button>
      <div></div>
      <button id="left">←</button>
      <div></div>
      <button id="right">→</button>
      <div></div>
      <button id="down">↓</button>
      <div></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:15px; align-items:center;">
      <button id="shoot" class="special-btn">SPARA</button>
      
      <button id="bazooka" class="special-btn" style="font-size:13px;">BAZOOKA</button>
      <button id="tornado" class="special-btn" style="font-size:13px;">TORNADO</button>
      <button id="fire" class="special-btn" style="font-size:13px;">FUOCO</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const timeElement = document.getElementById('time');

let timeSurvived = 0;
let gameRunning = true;
let lastTime = Date.now();

// Giocatore (cursore giallo)
const player = {
  x: 400,
  y: 480,
  width: 28,
  height: 38,
  speed: 7
};

let bullets = [];
let enemies = [];
let keys = {};

// ===================== CONTROLLI TOUCH =====================
function setupControls() {
  // Freccette
  document.getElementById('up').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowUp'] = true; });
  document.getElementById('up').addEventListener('touchend', () => keys['ArrowUp'] = false);

  document.getElementById('down').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowDown'] = true; });
  document.getElementById('down').addEventListener('touchend', () => keys['ArrowDown'] = false);

  document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
  document.getElementById('left').addEventListener('touchend', () => keys['ArrowLeft'] = false);

  document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
  document.getElementById('right').addEventListener('touchend', () => keys['ArrowRight'] = false);

  // Spara normale
  let shooting = false;
  const shootBtn = document.getElementById('shoot');
  shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shooting = true; });
  shootBtn.addEventListener('touchend', () => shooting = false);

  setInterval(() => {
    if (shooting && gameRunning) shoot();
  }, 80);

  // Mosse speciali (una volta ogni 8 secondi)
  let lastSpecial = 0;
  const specialCooldown = 8000;

  document.getElementById('bazooka').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (Date.now() - lastSpecial > specialCooldown) {
      bazookaAttack();
      lastSpecial = Date.now();
    }
  });

  document.getElementById('tornado').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (Date.now() - lastSpecial > specialCooldown) {
      tornadoAttack();
      lastSpecial = Date.now();
    }
  });

  document.getElementById('fire').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (Date.now() - lastSpecial > specialCooldown) {
      fireAttack();
      lastSpecial = Date.now();
    }
  });
}

// ===================== GIOCO =====================
function shoot() {
  bullets.push({
    x: player.x,
    y: player.y - 30,
    width: 6,
    height: 18,
    speed: 16
  });
}

function bazookaAttack() {
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      bullets.push({
        x: player.x + (Math.random()*60 - 30),
        y: player.y - 40,
        width: 12,
        height: 25,
        speed: 10,
        color: '#ff8800'
      });
    }, i * 60);
  }
}

function tornadoAttack() {
  for (let i = 0; i < 15; i++) {
    bullets.push({
      x: player.x + (Math.random()*200 - 100),
      y: player.y - 50 - i*15,
      width: 8,
      height: 8,
      speed: 8,
      color: '#00ffff'
    });
  }
}

function fireAttack() {
  for (let i = 0; i < 20; i++) {
    bullets.push({
      x: player.x,
      y: player.y - 30 - i*10,
      width: 5,
      height: 20,
      speed: 12,
      color: '#ff4400'
    });
  }
}

function spawnEnemy() {
  if (Math.random() < 0.045) {
    enemies.push({
      x: Math.random() * (canvas.width - 60) + 30,
      y: -40,
      radius: 15,
      speed: 2.8 + Math.random() * 2.2
    });
  }
}

function gameLoop() {
  if (!gameRunning) return;

  // Movimento
  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;
  if (keys['ArrowUp']) player.y -= player.speed;
  if (keys['ArrowDown']) player.y += player.speed;

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(30, Math.min(canvas.height - 50, player.y));

  // Aggiorna tempo
  if (Date.now() - lastTime > 1000) {
    timeSurvived++;
    timeElement.textContent = timeSurvived;
    lastTime = Date.now();
  }

  // Aggiorna proiettili
  bullets = bullets.filter(b => {
    b.y -= b.speed || 15;
    return b.y > -50;
  });

  // Spawn nemici
  spawnEnemy();

  // Aggiorna nemici
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    if (Math.sqrt(dx*dx + dy*dy) < 30 + e.radius) {
      gameOver();
      return;
    }

    if (e.y > canvas.height + 50) enemies.splice(i, 1);
  }

  // Collisione proiettili - nemici
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i];
      const e = enemies[j];
      const dx = b.x - e.x;
      const dy = b.y - e.y;
      if (Math.sqrt(dx*dx + dy*dy) < e.radius + 8) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        score += 20;
        break;
      }
    }
  }

  // Disegno
  ctx.fillStyle = '#0a3d0a'; // prato scuro
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Erba che scorre (effetto movimento)
  ctx.fillStyle = '#1a5a1a';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(0, (Date.now()/10 % 80) + i*80 - 40, canvas.width, 8);
  }

  // Disegna cursore GIALLO
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 26);
  ctx.lineTo(player.x - 15, player.y + 20);
  ctx.lineTo(player.x - 7, player.y + 14);
  ctx.lineTo(player.x + 7, player.y + 14);
  ctx.lineTo(player.x + 15, player.y + 20);
  ctx.closePath();
  ctx.fill();

  // Proiettili
  ctx.fillStyle = '#00ffff';
  bullets.forEach(b => {
    ctx.fillRect(b.x - 3, b.y, 6, 18);
  });

  // Nemici VERDI
  ctx.fillStyle = '#00cc22';
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  alert(`GAME OVER!\n\nSei sopravvissuto ${timeSurvived} secondi!\n\nPunteggio: ${timeSurvived * 10}\n\nRicarica la pagina per giocare di nuovo.`);
}

// Avvio
setupControls();
gameLoop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Shooter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #e50914;
      image-rendering: pixelated;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      font-size: 20px;
      text-shadow: 0 0 10px #e50914;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 40px 60px;
      border: 4px solid #e50914;
      border-radius: 15px;
      text-align: center;
      display: none;
    }
    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 18px;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui">Punteggio: <span id="score">0</span></div>
  
  <canvas id="game" width="800" height="600"></canvas>

  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Punteggio finale: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">Gioca di nuovo</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const gameOverScreen = document.getElementById('gameOver');
const finalScoreElement = document.getElementById('finalScore');

let score = 0;
let gameRunning = true;

// Giocatore (omino verde stile cursore)
const player = {
  x: 400,
  y: 500,
  size: 25,
  speed: 6
};

// Proiettili
let bullets = [];

// Nemici (cerchi rossi)
let enemies = [];

// Tasti premuti
let keys = {};

// Event listeners tastiera
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Sparo automatico quando si tiene premuta la barra spaziatrice
let lastShot = 0;
const shootInterval = 120; // millisecondi tra uno sparo e l'altro

function shoot() {
  const now = Date.now();
  if (now - lastShot > shootInterval) {
    bullets.push({
      x: player.x,
      y: player.y - 20,
      size: 6,
      speed: 12
    });
    lastShot = now;
  }
}

// Crea nemico
function spawnEnemy() {
  if (Math.random() < 0.03) {  // probabilità di spawn
    enemies.push({
      x: Math.random() * canvas.width,
      y: -30,
      size: 18 + Math.random() * 12,
      speed: 2 + Math.random() * 3
    });
  }
}

// Game Loop
function gameLoop() {
  if (!gameRunning) return;

  // Movimento giocatore
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;

  // Limiti schermo
  player.x = Math.max(player.size/2, Math.min(canvas.width - player.size/2, player.x));
  player.y = Math.max(player.size/2, Math.min(canvas.height - player.size/2, player.y));

  // Sparo automatico
  if (keys[' ']) shoot();

  // Aggiorna proiettili
  bullets = bullets.filter(b => {
    b.y -= b.speed;
    return b.y > -10;
  });

  // Spawn nemici
  spawnEnemy();

  // Aggiorna nemici
  for (let i = 0; i < enemies.length; i++) {
    const enemy = enemies[i];
    enemy.y += enemy.speed;

    // Collisione con giocatore
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const distance = Math.sqrt(dx*dx + dy*dy);

    if (distance < player.size/2 + enemy.size/2) {
      gameOver();
      return;
    }

    // Rimuovi nemici usciti dallo schermo
    if (enemy.y > canvas.height + 50) {
      enemies.splice(i, 1);
      i--;
    }
  }

  // Collisione proiettili - nemici
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i];
      const e = enemies[j];

      const dx = b.x - e.x;
      const dy = b.y - e.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < b.size + e.size/2) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        score += 10;
        scoreElement.textContent = score;
        break;
      }
    }
  }

  // Disegna tutto
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Disegna giocatore (omino verde stile cursore)
  ctx.fillStyle = '#00ff00';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 18);
  ctx.lineTo(player.x - 12, player.y + 12);
  ctx.lineTo(player.x, player.y + 6);
  ctx.lineTo(player.x + 12, player.y + 12);
  ctx.closePath();
  ctx.fill();

  // Disegna proiettili
  ctx.fillStyle = '#ffff00';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Disegna nemici (cerchi rossi)
  ctx.fillStyle = '#ff0000';
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  finalScoreElement.textContent = score;
  gameOverScreen.style.display = 'block';
}

function restartGame() {
  score = 0;
  scoreElement.textContent = '0';
  bullets = [];
  enemies = [];
  player.x = 400;
  player.y = 500;
  gameRunning = true;
  gameOverScreen.style.display = 'none';
  gameLoop();
}

// Inizia il gioco
gameLoop();
</script>
</body>
</html>

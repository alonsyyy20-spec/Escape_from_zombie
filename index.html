<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      color: white;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }
    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      padding: 20px 50px;
      display: flex;
      align-items: center;
      position: fixed;
      width: 100%;
      z-index: 100;
    }
    .logo {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: -4px;
      display: flex;
      align-items: center;
    }
    .logo .z {
      color: #e50914;
      animation: pulse 2s infinite;
      font-size: 50px;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .nav {
      margin-left: auto;
      display: flex;
      gap: 20px;
    }
    .nav button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .hero {
      height: 90vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      padding: 0 50px;
      position: relative;
    }
    .hero-content {
      max-width: 600px;
    }
    .hero h1 {
      font-size: 4rem;
      margin: 0;
    }
    .row {
      padding: 20px 50px;
      margin-top: 30px;
    }
    .row h2 {
      margin-bottom: 15px;
    }
    .movies {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .movie {
      width: 220px;
      height: 130px;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s;
      flex-shrink: 0;
    }
    .movie:hover {
      transform: scale(1.15);
      z-index: 10;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      width: 80%;
      max-width: 900px;
    }
    video {
      width: 100%;
      border-radius: 10px;
    }
    .admin-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #e50914;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(229,9,20,0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span class="z">Z</span>otflix
    </div>
    <div class="nav">
      <button onclick="showAdmin()">👤 Admin (solo tu)</button>
    </div>
  </header>

  <!-- Hero -->
  <div class="hero" id="hero" style="background-image: url('https://picsum.photos/1920/1080?random=1')">
    <div class="hero-content">
      <h1 id="hero-title">Il Tuo Film</h1>
      <p id="hero-desc">Caricato da te</p>
      <button onclick="playFeatured()" style="background:#e50914; border:none; color:white; padding:12px 30px; font-size:18px; border-radius:5px; cursor:pointer;">
        ▶ Riproduci
      </button>
    </div>
  </div>

  <!-- Contenuti -->
  <div class="row">
    <h2>I miei film</h2>
    <div class="movies" id="myMovies"></div>
  </div>

  <!-- Modal Video -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <video id="player" controls autoplay></video>
      <button onclick="closeModal()" style="margin-top:10px; background:#333; color:white; border:none; padding:10px 20px;">Chiudi</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div class="modal" id="adminModal">
    <div class="modal-content" style="background:#1f1f1f; padding:30px; border-radius:10px;">
      <h2>Carica nuovo film (Solo tu)</h2>
      <input type="text" id="title" placeholder="Titolo del film" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      <input type="text" id="desc" placeholder="Breve descrizione" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      <input type="text" id="image" placeholder="URL copertina (immagine)" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      <input type="text" id="videoUrl" placeholder="URL video (mp4 o YouTube)" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      
      <button onclick="addMovie()" style="background:#e50914; color:white; border:none; padding:15px 30px; margin-top:15px; border-radius:5px; cursor:pointer;">
        Pubblica Film
      </button>
      <button onclick="closeAdmin()" style="margin-left:10px; background:#555; color:white; border:none; padding:15px 30px; border-radius:5px; cursor:pointer;">
        Chiudi
      </button>
    </div>
  </div>

  <button class="admin-btn" onclick="showAdmin()">+ Carica Film (Solo io)</button>

<script>
// Array film (salvato in localStorage)
let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];

// Renderizza i film
function renderMovies() {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';
  
  movies.forEach((movie, index) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image}')`;
    div.onclick = () => playMovie(index);
    container.appendChild(div);
  });
}

// Aggiungi film
function addMovie() {
  const title = document.getElementById('title').value;
  const desc = document.getElementById('desc').value;
  const image = document.getElementById('image').value;
  const videoUrl = document.getElementById('videoUrl').value;

  if (!title || !image || !videoUrl) {
    alert("Inserisci titolo, copertina e URL video!");
    return;
  }

  movies.push({ title, desc, image, videoUrl });
  localStorage.setItem('zotflixMovies', JSON.stringify(movies));
  
  renderMovies();
  closeAdmin();
  
  alert("Film pubblicato con successo su Zotflix! 🔥");
}

// Riproduci film
function playMovie(index) {
  const movie = movies[index];
  document.getElementById('player').src = movie.videoUrl;
  document.getElementById('videoModal').style.display = 'flex';
}

// Play featured
function playFeatured() {
  if (movies.length > 0) {
    playMovie(0);
  } else {
    alert("Carica prima un film dall'area Admin!");
  }
}

function closeModal() {
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('player');
  video.pause();
  video.src = '';
  modal.style.display = 'none';
}

function showAdmin() {
  document.getElementById('adminModal').style.display = 'flex';
}

function closeAdmin() {
  document.getElementById('adminModal').style.display = 'none';
}

// Inizializza
renderMovies();
</script>

</body>
        </html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    body { margin:0; padding:0; background:#141414; color:white; font-family:Arial, sans-serif; overflow-x:hidden; }
    header { background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); padding:15px 20px; display:flex; align-items:center; position:fixed; width:100%; z-index:100; gap:15px; flex-wrap:wrap; }
    .logo { font-size:32px; font-weight:bold; letter-spacing:-3px; }
    .logo .z { color:#e50914; animation:pulse 2s infinite; font-size:38px; }
    @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.12);} 100%{transform:scale(1);} }

    .search-container { position:relative; flex:1; max-width:350px; }
    .search-icon { background:none; border:none; color:white; font-size:22px; cursor:pointer; position:absolute; left:10px; top:50%; transform:translateY(-50%); }
    .search-input { background:rgba(0,0,0,0.85); border:1px solid #666; color:white; padding:10px 15px 10px 45px; width:100%; border-radius:4px; font-size:16px; outline:none; }

    .nav { margin-left:auto; display:flex; align-items:center; gap:12px; }
    .nav button { background:none; border:none; color:white; font-size:15px; cursor:pointer; }

    .hero { height:85vh; min-height:500px; background-size:cover; background-position:center; display:flex; align-items:center; padding:0 20px; position:relative; margin-top:60px; }
    .row { padding:30px 20px 20px; }
    .movies { display:flex; gap:12px; overflow-x:auto; padding-bottom:15px; }
    .movie { width:180px; height:105px; background-size:cover; background-position:center; border-radius:8px; cursor:pointer; transition:transform 0.3s; flex-shrink:0; }
    .movie:hover { transform:scale(1.08); }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; padding:15px; }
    .modal-content { width:100%; max-width:1000px; background:#1f1f1f; padding:25px; border-radius:10px; }

    video { width:100%; border-radius:10px; }

    .admin-btn { position:fixed; bottom:20px; right:20px; background:#e50914; color:white; border:none; padding:14px 22px; border-radius:50px; font-size:15px; cursor:pointer; display:none; z-index:200; }
  </style>
</head>
<body>

  <header>
    <div class="logo"><span class="z">Z</span>otflix</div>
    <div class="search-container">
      <button class="search-icon" id="searchIcon">🔍</button>
      <input type="text" id="searchInput" class="search-input" placeholder="Cerca film...">
    </div>
    <div class="nav">
      <button onclick="showLogin()">🔑 Password Admin</button>
      <button id="adminNavBtn" onclick="showAdmin()" style="display:none;">👤 Admin</button>
    </div>
  </header>

  <div class="hero" style="background-image: url('https://picsum.photos/1920/1080?random=1')">
    <div class="hero-content">
      <h1>Benvenuto su Zotflix</h1>
      <p>La tua piattaforma privata</p>
      <button onclick="playFeatured()" style="background:#e50914; border:none; color:white; padding:12px 28px; font-size:17px; border-radius:5px; cursor:pointer;">▶ Riproduci</button>
    </div>
  </div>

  <div class="row">
    <h2>I miei film</h2>
    <div class="movies" id="myMovies"></div>
  </div>

  <!-- Modal Video -->
  <div class="modal" id="videoModal">
    <div class="modal-content" style="background:#000; padding:0;">
      <video id="player" controls autoplay></video>
      <button onclick="closeModal()" style="margin:15px; background:#333; color:white; border:none; padding:10px 20px;">Chiudi</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <h2>Carica nuovo film (Solo tu)</h2>
      <input type="text" id="title" placeholder="Titolo del film" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      <input type="text" id="desc" placeholder="Breve descrizione" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      <input type="text" id="image" placeholder="URL copertina (opzionale)" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">

      <button onclick="document.getElementById('videoFile').click()" style="background:#e50914; color:white; border:none; padding:12px 20px; margin:10px 0; border-radius:5px; cursor:pointer; width:100%;">
        📁 Seleziona Video dalla Galleria
      </button>
      <input type="file" id="videoFile" accept="video/mp4,video/webm" style="display:none;" onchange="handleVideoUpload(event)">

      <button onclick="addMovie()" style="background:#e50914; color:white; border:none; padding:15px 30px; margin-top:15px; border-radius:5px; cursor:pointer;">
        Pubblica Film
      </button>
      <button onclick="closeAdmin()" style="margin-left:10px; background:#555; color:white; border:none; padding:15px 30px; border-radius:5px; cursor:pointer;">
        Chiudi
      </button>
    </div>
  </div>

  <button class="admin-btn" id="adminFloatBtn" onclick="showAdmin()">+ Carica Film (Solo io)</button>

<script>
// ==================== PASSWORD ====================
const ADMIN_PASSWORD = "admin";   // ← cambia qui la tua password

let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];
let isAdminLoggedIn = false;

// Renderizza film
function renderMovies(filtered = movies) {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';
  if (filtered.length === 0) {
    container.innerHTML = '<p style="color:#888;">Nessun film trovato...</p>';
    return;
  }
  filtered.forEach((movie, i) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image || "https://picsum.photos/220/130?random=" + i}')`;
    div.onclick = () => playMovie(i);
    container.appendChild(div);
  });
}

// Gestione caricamento video locale
let currentVideoFile = null;
let currentVideoURL = null;

function handleVideoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('video/')) {
    alert("Seleziona solo file video (mp4, webm)");
    return;
  }
  currentVideoFile = file;
  currentVideoURL = URL.createObjectURL(file);
  alert("Video caricato correttamente! Ora inserisci titolo e pubblica.");
}

// Aggiungi film
function addMovie() {
  if (!isAdminLoggedIn) return;

  const title = document.getElementById('title').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const image = document.getElementById('image').value.trim();

  if (!title) {
    alert("Inserisci almeno il titolo!");
    return;
  }
  if (!currentVideoURL) {
    alert("Devi prima selezionare un video dalla galleria!");
    return;
  }

  movies.push({
    title,
    desc,
    image: image || "",
    videoURL: currentVideoURL,   // URL locale creato dal file
    isLocal: true
  });

  localStorage.setItem('zotflixMovies', JSON.stringify(movies));
  renderMovies();
  closeAdmin();

  // Reset
  currentVideoFile = null;
  currentVideoURL = null;
  document.getElementById('title').value = '';
  document.getElementById('desc').value = '';
  document.getElementById('image').value = '';
  document.getElementById('videoFile').value = '';

  alert("Film aggiunto con successo! 🎉");
}

// Riproduci film
function playMovie(index) {
  const movie = movies[index];
  const player = document.getElementById('player');
  player.src = movie.videoURL || movie.videoUrl;
  document.getElementById('videoModal').style.display = 'flex';
}

function playFeatured() {
  if (movies.length > 0) playMovie(0);
  else alert("Nessun film caricato.");
}

function closeModal() {
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('player');
  video.pause();
  video.src = '';
  modal.style.display = 'none';
}

// Login e Admin
function showLogin() {
  document.getElementById('loginModal').style.display = 'flex';
}

function showAdmin() {
  if (!isAdminLoggedIn) {
    showLogin();
    return;
  }
  document.getElementById('adminModal').style.display = 'flex';
}

function closeAdmin() {
  document.getElementById('adminModal').style.display = 'none';
}

function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  if (input === ADMIN_PASSWORD) {
    isAdminLoggedIn = true;
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('adminNavBtn').style.display = 'block';
    document.getElementById('adminFloatBtn').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  } else {
    document.getElementById('loginError').style.display = 'block';
    setTimeout(() => document.getElementById('loginError').style.display = 'none', 2500);
  }
}

function setupSearch() {
  const input = document.getElementById('searchInput');
  input.addEventListener('input', () => {
    const term = input.value.toLowerCase().trim();
    const filtered = term === '' ? movies : movies.filter(m => m.title.toLowerCase().includes(term));
    renderMovies(filtered);
  });
}

// Login Modal HTML (aggiunto)
document.body.insertAdjacentHTML('beforeend', `
<div class="modal" id="loginModal">
  <div class="modal-content" style="max-width:380px; text-align:center;">
    <h2>🔑 Accesso Admin</h2>
    <p>Inserisci la password</p>
    <input type="password" id="passwordInput" placeholder="Password" style="width:100%; padding:12px; margin:15px 0; background:#333; border:none; color:white;">
    <button onclick="checkPassword()" style="background:#e50914; color:white; border:none; padding:12px 30px; width:100%; border-radius:5px; cursor:pointer;">Accedi</button>
    <p id="loginError" style="color:#e50914; margin-top:10px; display:none;">Password errata!</p>
  </div>
</div>
`);

// Inizializza
renderMovies();
setupSearch();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    :root { --red: #e50914; }
    body {
      margin: 0; padding: 0;
      background: #141414;
      color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #splash {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .logo-big {
      font-size: 90px; font-weight: 900; letter-spacing: -6px;
      color: white; text-shadow: 0 0 60px var(--red);
    }

    #profile-screen, .home-screen { display: none; }

    .profile-container {
      display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; padding: 20px;
    }
    .profile {
      text-align: center; cursor: pointer; position: relative;
    }
    .profile-img {
      width: 130px; height: 130px; border-radius: 12px; object-fit: cover;
      border: 4px solid transparent;
    }
    .profile:hover .profile-img { border-color: var(--red); }
    .profile-name { margin-top: 10px; font-size: 18px; }

    .movies {
      display: flex; gap: 12px; overflow-x: auto; padding: 20px;
    }
    .movie {
      width: 190px; height: 107px; background-size: cover; background-position: center;
      border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="logo-big">ZOTFLIX</div>
  </div>

  <!-- Profili -->
  <div id="profile-screen">
    <h1 style="text-align:center; margin:40px 0;">Chi sta guardando?</h1>
    <div class="profile-container" id="profiles"></div>
  </div>

  <!-- Home -->
  <div class="home-screen" id="home-screen">
    <header style="background:#000; padding:15px; text-align:center; font-size:28px; color:var(--red);">
      ZOTFLIX
    </header>
    <div style="padding:80px 20px 20px;">
      <h2>I miei film</h2>
      <div class="movies" id="myMovies"></div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:3000; align-items:center; justify-content:center; padding:15px;">
    <div style="background:#1f1f1f; padding:25px; border-radius:12px; width:100%; max-width:600px;">
      <h2>Carica nuovo film</h2>
      <input type="text" id="title" placeholder="Titolo del film" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">
      <input type="text" id="desc" placeholder="Descrizione" style="width:100%; padding:12px; margin:10px 0; background:#333; border:none; color:white;">

      <button onclick="document.getElementById('coverFile').click()" style="width:100%; padding:14px; margin:10px 0; background:#333; color:white; border:none;">
        🖼️ Copertina dalla Galleria
      </button>
      <input type="file" id="coverFile" accept="image/*" style="display:none;">

      <button onclick="document.getElementById('videoFile').click()" style="width:100%; padding:14px; margin:10px 0; background:var(--red); color:white; border:none;">
        📹 Video dalla Galleria
      </button>
      <input type="file" id="videoFile" accept="video/*" style="display:none;">

      <div style="margin-top:20px;">
        <button onclick="addMovie()" style="background:var(--red); color:white; border:none; padding:14px 30px; width:100%; border-radius:6px;">Pubblica Film</button>
      </div>
      <button onclick="closeAdmin()" style="margin-top:10px; background:#555; color:white; border:none; padding:12px; width:100%; border-radius:6px;">Annulla</button>
    </div>
  </div>

<script>
// Password
const ADMIN_PASSWORD = "admin";

let profiles = JSON.parse(localStorage.getItem('zotflixProfiles')) || [
  { id: 1, name: "Matteo", image: "https://picsum.photos/id/64/300/300" },
  { id: 2, name: "Sara", image: "https://picsum.photos/id/65/300/300" }
];

let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];
let currentProfile = null;

// Splash
setTimeout(() => {
  document.getElementById('splash').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    showProfileScreen();
  }, 1500);
}, 2000);

function showProfileScreen() {
  const container = document.getElementById('profiles');
  container.innerHTML = '';

  profiles.forEach(p => {
    const div = document.createElement('div');
    div.className = 'profile';
    div.innerHTML = `
      <img src="${p.image}" class="profile-img">
      <div class="profile-name">${p.name}</div>
    `;
    div.onclick = () => selectProfile(p);
    container.appendChild(div);
  });

  document.getElementById('profile-screen').style.display = 'flex';
}

function selectProfile(profile) {
  currentProfile = profile;
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  renderMovies();
}

function renderMovies() {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';

  movies.forEach((movie, i) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image}')`;
    div.onclick = () => playMovie(i);
    container.appendChild(div);
  });
}

function playMovie(i) {
  const movie = movies[i];
  if (movie && movie.videoURL) {
    const video = document.createElement('video');
    video.src = movie.videoURL;
    video.controls = true;
    video.style.width = '100%';
    video.style.maxHeight = '80vh';
    document.body.appendChild(video);
    video.play();
  }
}

// Admin
function showAdmin() {
  const pass = prompt("Password Admin:");
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('adminModal').style.display = 'flex';
  } else {
    alert("Password errata!");
  }
}

function closeAdmin() {
  document.getElementById('adminModal').style.display = 'none';
}

function addMovie() {
  const title = document.getElementById('title').value.trim();
  if (!title) {
    alert("Inserisci il titolo!");
    return;
  }

  const videoInput = document.getElementById('videoFile');
  if (!videoInput.files[0]) {
    alert("Seleziona un video!");
    return;
  }

  const file = videoInput.files[0];
  if (file.size > 100 * 1024 * 1024) {  // limite 100MB
    alert("Il video è troppo grande! Usa un video più piccolo (max 100MB).");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    movies.push({
      title: title,
      image: "https://picsum.photos/220/130?random=" + Date.now(),
      videoURL: e.target.result
    });

    localStorage.setItem('zotflixMovies', JSON.stringify(movies));
    renderMovies();
    closeAdmin();
    alert("Film pubblicato con successo!");
  };
  reader.readAsDataURL(file);
}

// Inizializza
</script>
</body>
</html>

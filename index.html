<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    :root { --red: #e50914; }
    body {
      margin: 0; padding: 0;
      background: #141414;
      color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 2s;
    }
    .zotflix-logo {
      font-size: 95px; font-weight: 900; letter-spacing: -6px;
      color: white; text-shadow: 0 0 60px var(--red);
      animation: glow 2.2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 30px var(--red); }
      to { text-shadow: 0 0 90px var(--red); }
    }

    /* Profili Screen */
    #profile-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #141414; display: none; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px 10px;
    }
    h1 { font-size: 38px; margin-bottom: 40px; text-align: center; }

    .profile-container {
      display: flex; flex-wrap: wrap; gap: 25px; justify-content: center;
      max-width: 1000px;
    }
    .profile {
      text-align: center; cursor: pointer; position: relative;
      transition: transform 0.3s;
    }
    .profile:hover { transform: scale(1.1); }
    .profile-img {
      width: 130px; height: 130px; border-radius: 12px; object-fit: cover;
      border: 3px solid transparent; transition: all 0.3s;
    }
    .profile:hover .profile-img { border: 3px solid var(--red); }
    .profile-name { margin-top: 10px; font-size: 17px; }

    .edit-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75);
      color: white; border: none; width: 30px; height: 30px; border-radius: 50%;
      font-size: 16px; cursor: pointer; display: none; z-index: 10;
    }
    .profile:hover .edit-btn { display: block; }

    .add-profile {
      width: 130px; height: 130px; border: 3px dashed #666; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 55px;
      color: #666; cursor: pointer;
    }

    /* Home Screen */
    .home-screen { display: none; }
    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
      padding: 15px 20px; display: flex; align-items: center; position: fixed;
      width: 100%; z-index: 100;
    }
    .logo { font-size: 32px; font-weight: bold; color: var(--red); }

    .right-header {
      margin-left: auto; display: flex; align-items: center; gap: 12px;
    }
    .movies { 
      display: flex; gap: 12px; overflow-x: auto; 
      padding: 90px 20px 30px; 
    }
    .movie {
      width: 190px; height: 107px; background-size: cover; background-position: center;
      border-radius: 6px; cursor: pointer; transition: transform 0.4s; flex-shrink: 0;
    }
    .movie:hover { transform: scale(1.15); }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash-screen">
    <div class="zotflix-logo">ZOTFLIX</div>
  </div>

  <!-- Schermata Profili -->
  <div id="profile-screen">
    <h1>Chi sta guardando?</h1>
    <div class="profile-container" id="profiles"></div>
  </div>

  <!-- Home -->
  <div class="home-screen" id="home-screen">
    <header>
      <div class="logo">ZOTFLIX</div>
      <div class="right-header">
        <span id="current-profile-name" style="font-size:18px; cursor:pointer;" onclick="logoutProfile()"></span>
        <button onclick="showAdmin()" style="background:var(--red); border:none; color:white; padding:8px 18px; border-radius:4px; cursor:pointer;">Admin</button>
      </div>
    </header>

    <div style="padding-top:100px; padding-left:20px;">
      <h2>I miei film</h2>
      <div class="movies" id="myMovies"></div>
    </div>
  </div>

  <!-- Modal Video -->
  <div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center;">
    <div style="width:95%; max-width:1100px;">
      <video id="player" controls autoplay controlsList="nodownload" style="width:100%; border-radius:8px;"></video>
      <button onclick="closeModal()" style="margin-top:15px; background:#333; color:white; border:none; padding:12px 25px; border-radius:4px;">Chiudi</button>
    </div>
  </div>

<script>
// ==================== 25 IMMAGINI BELLE PER PROFILI ====================
const profileImages = [
  "https://picsum.photos/id/64/300/300", "https://picsum.photos/id/65/300/300",
  "https://picsum.photos/id/91/300/300", "https://picsum.photos/id/1005/300/300",
  "https://picsum.photos/id/1011/300/300", "https://picsum.photos/id/1027/300/300",
  "https://picsum.photos/id/106/300/300", "https://picsum.photos/id/133/300/300",
  "https://picsum.photos/id/201/300/300", "https://picsum.photos/id/238/300/300",
  "https://picsum.photos/id/251/300/300", "https://picsum.photos/id/274/300/300",
  "https://picsum.photos/id/669/300/300", "https://picsum.photos/id/870/300/300",
  "https://picsum.photos/id/1009/300/300", "https://picsum.photos/id/1012/300/300",
  "https://picsum.photos/id/102/300/300", "https://picsum.photos/id/160/300/300",
  "https://picsum.photos/id/201/300/300", "https://picsum.photos/id/669/300/300",
  "https://picsum.photos/id/1005/300/300", "https://picsum.photos/id/133/300/300",
  "https://picsum.photos/id/238/300/300", "https://picsum.photos/id/274/300/300",
  "https://picsum.photos/id/870/300/300"
];

// ==================== DATI ====================
let profiles = JSON.parse(localStorage.getItem('zotflixProfiles')) || [
  { id: 1, name: "Matteo", image: profileImages[0] },
  { id: 2, name: "Sara", image: profileImages[1] }
];

let currentProfile = null;
let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];
const ADMIN_PASSWORD = "admin";

// Splash Screen
setTimeout(() => {
  document.getElementById('splash-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('splash-screen').style.display = 'none';
    showProfileScreen();
  }, 1800);
}, 2000);

// Schermata Profili
function showProfileScreen() {
  const container = document.getElementById('profiles');
  container.innerHTML = '';

  profiles.forEach(profile => {
    const div = document.createElement('div');
    div.className = 'profile';
    div.innerHTML = `
      <img src="\( {profile.image}" class="profile-img" alt=" \){profile.name}">
      <button class="edit-btn" onclick="editProfile(${profile.id}); event.stopImmediatePropagation();">✏️</button>
      <div class="profile-name">${profile.name}</div>
    `;
    div.onclick = () => selectProfile(profile);
    container.appendChild(div);
  });

  // Pulsante Aggiungi
  const addDiv = document.createElement('div');
  addDiv.className = 'profile';
  addDiv.innerHTML = `<div class="add-profile">+</div><div class="profile-name">Aggiungi</div>`;
  addDiv.onclick = addNewProfile;
  container.appendChild(addDiv);

  document.getElementById('profile-screen').style.display = 'flex';
}

function selectProfile(profile) {
  currentProfile = profile;
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  document.getElementById('current-profile-name').textContent = profile.name;
  renderMovies();
}

function editProfile(id) {
  const profile = profiles.find(p => p.id === id);
  if (!profile) return;

  const newName = prompt("Nuovo nome:", profile.name);
  if (newName) profile.name = newName;

  const newImg = prompt("Inserisci URL della nuova immagine:", profile.image);
  if (newImg) profile.image = newImg;

  localStorage.setItem('zotflixProfiles', JSON.stringify(profiles));
  showProfileScreen();
}

function addNewProfile() {
  if (profiles.length >= 5) return alert("Massimo 5 profili!");

  const name = prompt("Nome del nuovo profilo:");
  if (!name) return;

  const randomImg = profileImages[Math.floor(Math.random() * profileImages.length)];

  profiles.push({ id: Date.now(), name: name, image: randomImg });
  localStorage.setItem('zotflixProfiles', JSON.stringify(profiles));
  showProfileScreen();
}

function logoutProfile() {
  if (confirm("Cambiare profilo?")) {
    document.getElementById('home-screen').style.display = 'none';
    currentProfile = null;
    showProfileScreen();
  }
}

// Render Film
function renderMovies() {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';
  movies.forEach((movie, i) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image}')`;
    div.onclick = () => playMovie(i);
    container.appendChild(div);
  });
}

function playMovie(index) {
  document.getElementById('player').src = movies[index].videoURL;
  document.getElementById('videoModal').style.display = 'flex';
}

function closeModal() {
  const video = document.getElementById('player');
  video.pause(); video.src = '';
  document.getElementById('videoModal').style.display = 'none';
}

// Admin
function showAdmin() {
  const pass = prompt("Inserisci password Admin:");
  if (pass === ADMIN_PASSWORD) {
    alert("✅ Accesso Admin riuscito!\n\nPuoi ora caricare film e copertine.");
  } else {
    alert("Password errata!");
  }
}

// Inizializza
</script>
</body>
</html>

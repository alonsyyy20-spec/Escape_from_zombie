<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escape from Zombie</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #ffff00;
      font-size: 24px;
      font-weight: bold;
      z-index: 100;
      text-shadow: 0 0 10px #ffff00;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 200;
      pointer-events: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: 70px 70px 70px;
      grid-template-rows: 70px 70px 70px;
      gap: 10px;
    }
    .dpad button {
      background: rgba(255,255,255,0.15);
      border: 3px solid #ffff00;
      color: white;
      font-size: 32px;
      border-radius: 12px;
      pointer-events: all;
    }
    .shoot-btn {
      width: 100px;
      height: 100px;
      background: rgba(255, 0, 0, 0.6);
      border: 5px solid #ffff00;
      color: #ffff00;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50%;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #title {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 15px #e50914;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="title">ESCAPE FROM ZOMBIE</div>
  <div id="ui">Punteggio: <span id="score">0</span></div>
  
  <canvas id="game" width="800" height="600"></canvas>

  <!-- Controlli Touch -->
  <div class="controls">
    <div class="dpad">
      <div></div>
      <button id="up">↑</button>
      <div></div>
      <button id="left">←</button>
      <div></div>
      <button id="right">→</button>
      <div></div>
      <button id="down">↓</button>
      <div></div>
    </div>

    <button id="shoot" class="shoot-btn">SPARA</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');

let score = 0;
let gameRunning = true;

// Giocatore - Cursore GIALLO lungo
const player = {
  x: 400,
  y: 480,
  width: 28,
  height: 38,
  speed: 7
};

let bullets = [];
let enemies = [];
let keys = {};

// ===================== TOUCH CONTROLS =====================
const upBtn = document.getElementById('up');
const downBtn = document.getElementById('down');
const leftBtn = document.getElementById('left');
const rightBtn = document.getElementById('right');
const shootBtn = document.getElementById('shoot');

function setupControls() {
  upBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowUp'] = true; });
  upBtn.addEventListener('touchend', () => keys['ArrowUp'] = false);

  downBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowDown'] = true; });
  downBtn.addEventListener('touchend', () => keys['ArrowDown'] = false);

  leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
  leftBtn.addEventListener('touchend', () => keys['ArrowLeft'] = false);

  rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
  rightBtn.addEventListener('touchend', () => keys['ArrowRight'] = false);

  // Spara continuo
  let shooting = false;
  shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shooting = true; });
  shootBtn.addEventListener('touchend', () => shooting = false);

  setInterval(() => {
    if (shooting && gameRunning) shoot();
  }, 70);
}

// ===================== GAME =====================
let lastShot = 0;

function shoot() {
  const now = Date.now();
  if (now - lastShot > 70) {
    bullets.push({
      x: player.x,
      y: player.y - 25,
      width: 6,
      height: 16,
      speed: 15
    });
    lastShot = now;
  }
}

function spawnEnemy() {
  if (Math.random() < 0.04) {
    enemies.push({
      x: Math.random() * (canvas.width - 60) + 30,
      y: -30,
      radius: 14,
      speed: 3 + Math.random() * 2.8
    });
  }
}

function gameLoop() {
  if (!gameRunning) return;

  // Movimento
  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;
  if (keys['ArrowUp']) player.y -= player.speed;
  if (keys['ArrowDown']) player.y += player.speed;

  player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
  player.y = Math.max(25, Math.min(canvas.height - 45, player.y));

  // Aggiorna proiettili
  bullets = bullets.filter(b => {
    b.y -= b.speed;
    return b.y > -30;
  });

  // Spawn nemici
  spawnEnemy();

  // Aggiorna nemici
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    // Collisione con giocatore
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    if (Math.sqrt(dx*dx + dy*dy) < 28 + e.radius) {
      gameOver();
      return;
    }

    if (e.y > canvas.height + 50) enemies.splice(i, 1);
  }

  // Collisione proiettili vs nemici
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i];
      const e = enemies[j];
      const dx = b.x - e.x;
      const dy = b.y - e.y;
      if (Math.sqrt(dx*dx + dy*dy) < e.radius + 8) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        score += 10;
        scoreElement.textContent = score;
        break;
      }
    }
  }

  // Disegno
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Disegna cursore GIALLO
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 24);
  ctx.lineTo(player.x - 14, player.y + 18);
  ctx.lineTo(player.x - 6, player.y + 12);
  ctx.lineTo(player.x + 6, player.y + 12);
  ctx.lineTo(player.x + 14, player.y + 18);
  ctx.closePath();
  ctx.fill();

  // Proiettili (cyan)
  ctx.fillStyle = '#00ffff';
  bullets.forEach(b => {
    ctx.fillRect(b.x - 3, b.y, 6, 16);
  });

  // Nemici VERDI
  ctx.fillStyle = '#00ff44';
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  alert("GAME OVER!\n\nPunteggio finale: " + score + "\n\nRicarica la pagina per giocare di nuovo.");
}

// Inizializza
setupControls();
gameLoop();
</script>
</body>
</html>

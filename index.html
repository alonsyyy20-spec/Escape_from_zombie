<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zotflix</title>
  <style>
    :root {
      --netflix-red: #e50914;
    }
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    /* Schermata di benvenuto con animazione Netflix */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1.5s;
    }
    .zotflix-logo {
      font-size: 120px;
      font-weight: 900;
      letter-spacing: -10px;
      color: white;
      text-shadow: 0 0 40px var(--netflix-red);
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 20px var(--netflix-red); }
      to { text-shadow: 0 0 60px var(--netflix-red), 0 0 80px var(--netflix-red); }
    }

    /* Schermata Profili */
    #profile-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #141414;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 1000;
    }
    .profile-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 900px;
    }
    .profile {
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .profile:hover {
      transform: scale(1.1);
    }
    .profile-img {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      border: 4px solid transparent;
      transition: border 0.3s;
    }
    .profile:hover .profile-img {
      border: 4px solid #e50914;
    }
    .profile-name {
      margin-top: 12px;
      font-size: 18px;
    }
    .add-profile {
      width: 140px;
      height: 140px;
      border: 4px dashed #666;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: #666;
      cursor: pointer;
    }

    /* Home principale */
    .home-screen {
      display: none;
    }
    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      padding: 15px 40px;
      display: flex;
      align-items: center;
      position: fixed;
      width: 100%;
      z-index: 100;
    }
    .logo { font-size: 38px; font-weight: bold; color: var(--netflix-red); }

    .movies { display: flex; gap: 12px; overflow-x: auto; padding: 20px 40px; }
    .movie {
      width: 220px;
      height: 124px;
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.4s;
      flex-shrink: 0;
    }
    .movie:hover {
      transform: scale(1.15);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Splash Screen con animazione -->
  <div id="splash-screen">
    <div class="zotflix-logo">ZOTFLIX</div>
  </div>

  <!-- Schermata Profili -->
  <div id="profile-screen">
    <h1 style="margin-bottom: 40px; font-size: 48px;">Chi sta guardando?</h1>
    <div class="profile-container" id="profiles"></div>
  </div>

  <!-- Schermata Home (dopo scelta profilo) -->
  <div class="home-screen" id="home-screen">
    <header>
      <div class="logo">ZOTFLIX</div>
      <div style="margin-left:auto; display:flex; align-items:center; gap:20px;">
        <span id="current-profile" style="font-size:18px; cursor:pointer;" onclick="logoutProfile()"></span>
        <button onclick="showAdmin()" style="background:#e50914; border:none; color:white; padding:8px 18px; border-radius:4px; cursor:pointer;">Admin</button>
      </div>
    </header>

    <div style="padding-top:100px;">
      <div class="row">
        <h2>I miei film</h2>
        <div class="movies" id="myMovies"></div>
      </div>
    </div>
  </div>

  <!-- Modal Video -->
  <div class="modal" id="videoModal" style="display:none;">
    <div class="modal-content">
      <video id="player" controls autoplay controlsList="nodownload nofullscreen" disablePictureInPicture></video>
      <button onclick="closeModal()" style="margin:15px; background:#333; color:white; border:none; padding:10px 20px; float:right;">Chiudi</button>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal" style="display:none;">
    <div class="modal-content" style="background:#1f1f1f; padding:30px; max-width:600px;">
      <h2>Carica nuovo film</h2>
      <!-- Qui puoi mettere il tuo pannello admin precedente -->
      <p style="color:#888;">(Pannello Admin - da completare)</p>
      <button onclick="closeAdmin()" style="margin-top:20px; background:#e50914; color:white; border:none; padding:12px 30px;">Chiudi</button>
    </div>
  </div>

<script>
// ==================== DATI ====================
let profiles = JSON.parse(localStorage.getItem('zotflixProfiles')) || [
  { id: 1, name: "Matteo", image: "https://picsum.photos/id/64/300/300" },
  { id: 2, name: "Sara", image: "https://picsum.photos/id/65/300/300" }
];

let currentProfile = null;
let movies = JSON.parse(localStorage.getItem('zotflixMovies')) || [];
let isAdminLoggedIn = false;
const ADMIN_PASSWORD = "admin";

// Splash Screen
setTimeout(() => {
  document.getElementById('splash-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('splash-screen').style.display = 'none';
    showProfileScreen();
  }, 1500);
}, 2200);

// Schermata Profili
function showProfileScreen() {
  const container = document.getElementById('profiles');
  container.innerHTML = '';

  profiles.forEach(profile => {
    const div = document.createElement('div');
    div.className = 'profile';
    div.innerHTML = `
      <img src="\( {profile.image}" class="profile-img" alt=" \){profile.name}">
      <div class="profile-name">${profile.name}</div>
    `;
    div.onclick = () => selectProfile(profile);
    container.appendChild(div);
  });

  // Pulsante Aggiungi Profilo
  const addDiv = document.createElement('div');
  addDiv.className = 'profile';
  addDiv.innerHTML = `<div class="add-profile">+</div><div class="profile-name">Aggiungi</div>`;
  addDiv.onclick = addNewProfile;
  container.appendChild(addDiv);

  document.getElementById('profile-screen').style.display = 'flex';
}

function selectProfile(profile) {
  currentProfile = profile;
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  document.getElementById('current-profile').textContent = profile.name;
  renderMovies();
}

function addNewProfile() {
  if (profiles.length >= 5) {
    alert("Hai raggiunto il massimo di 5 profili!");
    return;
  }
  const name = prompt("Nome del nuovo profilo:");
  if (!name) return;

  const imageUrl = prompt("Inserisci URL immagine (o lascia vuoto per default):", "https://picsum.photos/id/" + (Math.floor(Math.random()*100)+1) + "/300/300");
  
  const newProfile = {
    id: Date.now(),
    name: name,
    image: imageUrl || "https://picsum.photos/300/300"
  };
  
  profiles.push(newProfile);
  localStorage.setItem('zotflixProfiles', JSON.stringify(profiles));
  showProfileScreen();
}

function logoutProfile() {
  if (confirm("Vuoi cambiare profilo?")) {
    document.getElementById('home-screen').style.display = 'none';
    currentProfile = null;
    showProfileScreen();
  }
}

// Render Movies
function renderMovies() {
  const container = document.getElementById('myMovies');
  container.innerHTML = '';
  movies.forEach((movie, index) => {
    const div = document.createElement('div');
    div.className = 'movie';
    div.style.backgroundImage = `url('${movie.image}')`;
    div.onclick = () => playMovie(index);
    container.appendChild(div);
  });
}

function playMovie(index) {
  const movie = movies[index];
  document.getElementById('player').src = movie.videoURL;
  document.getElementById('videoModal').style.display = 'flex';
}

function closeModal() {
  const video = document.getElementById('player');
  video.pause();
  video.src = '';
  document.getElementById('videoModal').style.display = 'none';
}

// Admin functions (semplificate per ora)
function showAdmin() {
  if (!currentProfile) return;
  const pass = prompt("Inserisci password Admin:");
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('adminModal').style.display = 'flex';
  } else {
    alert("Password errata!");
  }
}

function closeAdmin() {
  document.getElementById('adminModal').style.display = 'none';
}

// Inizializza
</script>
</body>
</html>
